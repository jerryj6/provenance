[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "provenance"
version = "0.1.0"
description = "Detect copied language across AI-related bills."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "requests",
  "pypdf",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
provenance = "provenance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
